[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/CloudHolic/ruta"

[workspace.dependencies]
ruta-syntax = { path = "crates/ruta-syntax" }
ruta-runtime = { path = "crates/ruta-runtime" }
ruta-conformance = { path = "crates/ruta-conformance" }

anyhow = "1"
cc = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
