[files."goto.lua"]
tier = "v1.0"
note = "Line 328: without T, 'global' is not a reserved word; with T it is. The stage 1 parser has to know about this difference."

[files."heavy.lua"]
skip = "A stress test all.lua never invokes. It deliberately exhausts memory and runs past 120 seconds."

[files."literals.lua"]
