port = true
note = """The 'testing flush' block on lines 466-480 uses /dev/null and /dev/full with no `_port` guard,
unlike the other Unix-only blocks in this file. On Windows it stops at line 467, and the reference stops there too.
Without `port` it stops much earlier, at line 88."""

[files."gc.lua"]
