# Per-file tier and run options for vendor/lua-tests/. This is the only input to the conformance harness.
#
# tier - scoreboard group. Required unless `kip` is present.
#   v1.0        Runs meaningfully without T. ruta must match the reference for v1.0.
#   v2.0        Returns early when T == nil. Only becomes meaningful once a reference built with ltests and the C ABI layer exist.
#   impossible  Cannot be compared differentially even after v2.0 - currently no file.
# nondeterministic — output differs run to run; compare the exit code only.
# skip - excluded from a denominator. Exactly one of `tier` and `skip` must be present.
# port - run with -e "_port=true".
# recipe - a non-default way of running the file.
# note - prose for humand readers.
#
# Options (port, recipe) are not set to make a file pass. Differential testing counts a failure as a match
# when the reference fails the same way, so the only purpose of an option is to make more of the file execute.
# That is why main.lua gets no `port`: it would pass, but nothing in it would run.

[files."all.lua"]
tier = "v1.0"
nondeterministic = true
port = true
note = """Runs the whole suite. Its `dofile` round-trips each file through string.dump and load, and it asserts on return values between files,
so it verifies more than running the files separately. Without `port` it stops at main.lua and loses 27 files.
On Windows it reaches files.lua:467."""

[files."api.lua"]
tier = "v2.0"
note = "All 1416 lines sit behind an early `return` taken when T == nil. Without T it prints 3 lines."

[files."attrib.lua"]
tier = "v1.0"
port = true
note = "Without `port` it stops at the assertion on line 154. With it, the file runs to the end."

[files."big.lua"]
tier = "v1.0"
recipe = "coroutine"
note = "Must be wrapped in coroutine.wrap the way all.lua does it. Run plainly it fails with 'attempt to yield from outside a coroutine'."

[files."bitwise.lua"]
tier = "v1.0"

[files."bwcoercion.lua"]
skip = "Not a test — a module required by bitwise.lua."

[files."calls.lua"]
tier = "v1.0"

[files."closure.lua"]
